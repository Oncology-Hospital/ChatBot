version: '3'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: chatwoot123

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass chatwoot123"]
    volumes:
      - redis_data:/data

  rails:
    image: chatwoot/chatwoot:latest
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    image: chatwoot/chatwoot:latest
    restart: always
    depends_on:
      - postgres
      - redis
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  bot:
    build: 
      context: ./bot
    container_name: ungbuou_bot
    restart: always
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      - CHATWOOT_URL=http://rails:3000
    volumes:
      # Liên kết file logic để khi update Q&A qua thư mục máy chủ, Docker nhận ngay
      - ./bot/qa-data.json:/app/qa-data.json
      - ./bot/vectors.json:/app/vectors.json
      - ./bot/test-page.html:/app/test-page.html
      - ./bot/assets:/app/assets

volumes:
  pg_data:
  redis_data:
