<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duyệt đặt lịch khám</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #d9e1ee;
      --line-soft: #e8edf5;
      --text: #172033;
      --muted: #667085;
      --blue: #1267d8;
      --green: #087443;
      --amber: #a15c07;
      --red: #b42318;
      --slate: #475467;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      max-width: 1220px;
      margin: 0 auto;
      padding: 28px 24px 48px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 26px;
      line-height: 1.15;
      margin: 0 0 6px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    select, button, textarea {
      border: 1px solid #c8d0df;
      border-radius: 6px;
      padding: 9px 11px;
      font-size: 14px;
    }

    select {
      min-width: 142px;
      background: #fff;
    }

    button {
      min-height: 38px;
      cursor: pointer;
      background: var(--blue);
      color: #fff;
      border: 0;
      font-weight: 700;
      white-space: nowrap;
    }

    button.secondary {
      background: #eef2f8;
      color: #1e293b;
      border: 1px solid #c8d0df;
    }

    button.danger { background: var(--red); }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .toast-wrap {
      position: fixed;
      right: 18px;
      top: 18px;
      z-index: 20;
      display: grid;
      gap: 10px;
      width: min(360px, calc(100vw - 36px));
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      border: 1px solid transparent;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(16, 24, 40, 0.14);
      padding: 12px 14px;
      background: #fff;
      animation: toast-in 160ms ease-out;
    }

    .toast.ok {
      background: #eaf7ef;
      border-color: #bee7cf;
      color: #0b6b3f;
    }

    .toast.err {
      background: #fff0f0;
      border-color: #ffd0d0;
      color: #9b1c1c;
    }

    .toast-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .toast-body {
      font-size: 13px;
      line-height: 1.4;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1120px;
    }

    th, td {
      border-bottom: 1px solid var(--line-soft);
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #f8fafc;
      color: #465367;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fbfdff; }

    .id-col { width: 56px; }
    .status-col { width: 132px; }
    .patient-col { width: 250px; }
    .service-col { width: 220px; }
    .schedule-col { width: 180px; }
    .result-col { width: 260px; }
    .actions-col { width: 150px; }

    .patient-name,
    .service-name {
      display: block;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .line {
      margin: 2px 0;
      color: #1f2a3d;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .mono {
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
    }

    .status-pending { background: #eef4ff; color: #175cd3; }
    .status-submitted { background: #eaf7ef; color: var(--green); }
    .status-failed { background: #fff4e5; color: var(--amber); }
    .status-rejected { background: #fff0f0; color: var(--red); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .actions button {
      min-width: 76px;
      padding: 9px 10px;
    }

    .final-state {
      display: inline-block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      main { padding: 20px 12px 36px; }
      header { align-items: stretch; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
      select, button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Duyệt đặt lịch khám</h1>
        <p class="subtitle">Xem yêu cầu từ chatbot, kiểm tra lịch cho bệnh nhân đã có mã y tế và duyệt để gửi sang Youmed.</p>
      </div>
      <div class="toolbar">
        <select id="status" aria-label="Lọc trạng thái">
          <option value="pending">Chờ duyệt</option>
          <option value="submitted">Đã đặt</option>
          <option value="failed">Lỗi</option>
          <option value="rejected">Đã từ chối</option>
          <option value="">Tất cả</option>
        </select>
        <button id="reload" class="secondary">Tải lại</button>
      </div>
    </header>

    <div id="toast-root" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="id-col">ID</th>
            <th class="status-col">Trạng thái</th>
            <th class="patient-col">Bệnh nhân</th>
            <th class="service-col">Dịch vụ</th>
            <th class="schedule-col">Lịch</th>
            <th class="result-col">Kết quả</th>
            <th class="actions-col">Thao tác</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="7" class="empty">Đang tải...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    function fmtDate(value) {
      if (!value) return '';
      return String(value).slice(0, 10);
    }

    function showToast(title, body, ok = true) {
      const root = document.getElementById('toast-root');
      const item = document.createElement('div');
      item.className = `toast ${ok ? 'ok' : 'err'}`;
      item.innerHTML = `
        <div class="toast-title">${esc(title)}</div>
        ${body ? `<div class="toast-body">${esc(body)}</div>` : ''}
      `;
      root.appendChild(item);
      window.setTimeout(() => item.remove(), 4200);
    }

    function logAction(label, payload) {
      console.groupCollapsed(label);
      console.log(payload);
      console.groupEnd();
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[ch]));
    }

    function statusLabel(status) {
      return {
        pending: 'Chờ duyệt',
        submitted: 'Đã đặt',
        failed: 'Lỗi',
        rejected: 'Đã từ chối'
      }[status] || status || '';
    }

    function statusClass(status) {
      return {
        pending: 'status-pending',
        submitted: 'status-submitted',
        failed: 'status-failed',
        rejected: 'status-rejected'
      }[status] || 'status-pending';
    }

    function tryJson(value) {
      if (!value) return null;
      try {
        return JSON.parse(value);
      } catch (_) {
        return null;
      }
    }

    async function api(url, options) {
      const res = await fetch(url, options);
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || JSON.stringify(json));
      return json;
    }

    function resultHtml(row) {
      if (row.MaDatCho) {
        return [
          `<div class="line"><strong>Mã đặt chỗ:</strong> ${esc(row.MaDatCho)}</div>`,
          `<div class="line"><strong>STT:</strong> ${esc(row.STT)}</div>`,
          `<div class="line"><strong>Giờ khám:</strong> ${esc(row.GioKham)}</div>`
        ].join('');
      }

      const response = tryJson(row.YoumedResponse);
      if (response && response.message) {
        return `<div class="small">${esc(response.message)}</div>`;
      }

      const check = tryJson(row.CheckResult);
      if (check && check.message) {
        return `<div class="small">${esc(check.message)}</div>`;
      }

      return row.CheckResult
        ? `<div class="mono">${esc(row.CheckResult)}</div>`
        : '<span class="small">Chưa có kết quả.</span>';
    }

    function actionHtml(row) {
      if (row.Status !== 'pending') {
        return `<span class="final-state">Yêu cầu đã ở trạng thái "${esc(statusLabel(row.Status))}". Không còn thao tác.</span>`;
      }

      const hasMayTe = Boolean(row.MayTe);
      return `
        <div class="actions">
          <button class="secondary" onclick="check(${row.Id})" ${hasMayTe ? '' : 'disabled title="Bệnh nhân mới cần bấm Duyệt để tạo hồ sơ trước"'}>Kiểm tra</button>
          <button onclick="approve(${row.Id})">Duyệt</button>
          <button class="danger" onclick="reject(${row.Id})">Từ chối</button>
        </div>
      `;
    }

    function rowHtml(row) {
      const hasMayTe = Boolean(row.MayTe);
      return `<tr>
        <td>#${row.Id}</td>
        <td>
          <span class="pill ${statusClass(row.Status)}">${esc(statusLabel(row.Status))}</span>
          <div class="small">${esc(row.CreatedAt)}</div>
        </td>
        <td>
          <span class="patient-name">${esc(row.TenBenhNhan)}</span>
          <div class="line">Mã y tế: ${hasMayTe ? esc(row.MayTe) : '<span class="small">Bệnh nhân mới, chưa có mã y tế</span>'}</div>
          <div class="line">CCCD: ${esc(row.Cccd)}</div>
          <div class="line">SĐT: ${esc(row.SoDienThoai)}</div>
        </td>
        <td>
          <span class="service-name">${esc(row.TenDichVu)}</span>
          <div class="line">Mã: ${esc(row.MaDichVu)}</div>
          <div class="line">Loại: ${esc(row.LoaiDichVu)}</div>
          <div class="line">Giá: ${Number(row.Gia || 0).toLocaleString('vi-VN')}đ</div>
        </td>
        <td>
          <div class="line">Ngày: ${esc(fmtDate(row.NgayKham))}</div>
          <div class="line">Phòng: ${esc(row.PhongKham)}</div>
          <div class="line">Đối tượng: ${esc(row.DoiTuong)} / Loại giá: ${esc(row.LoaiGia)}</div>
        </td>
        <td>${resultHtml(row)}</td>
        <td>${actionHtml(row)}</td>
      </tr>`;
    }

    async function loadRows() {
      const status = document.getElementById('status').value;
      const json = await api(`/api/admin/appointments?status=${encodeURIComponent(status)}`);
      const rows = document.getElementById('rows');
      rows.innerHTML = json.appointments.length
        ? json.appointments.map(rowHtml).join('')
        : '<tr><td colspan="7" class="empty">Không có yêu cầu phù hợp.</td></tr>';
    }

    async function check(id) {
      try {
        const json = await api(`/api/admin/appointments/${id}/check`, { method: 'POST' });
        logAction(`Check appointment #${id}`, json);
        showToast(`Đã kiểm tra #${id}`, 'Chi tiết JSON đã được ghi trong Console.', true);
        await loadRows();
      } catch (err) {
        console.error(`Check appointment #${id} failed`, err);
        showToast(`Kiểm tra #${id} thất bại`, err.message, false);
      }
    }

    async function approve(id) {
      if (!confirm(`Duyệt và gửi đặt khám #${id} sang Youmed?`)) return;
      try {
        const json = await api(`/api/admin/appointments/${id}/approve`, { method: 'POST' });
        logAction(`Approve appointment #${id}`, json);
        showToast(`Đã duyệt #${id}`, 'Lịch đã được gửi sang Youmed. Chi tiết JSON đã được ghi trong Console.', true);
        await loadRows();
      } catch (err) {
        console.error(`Approve appointment #${id} failed`, err);
        showToast(`Duyệt #${id} thất bại`, err.message, false);
        await loadRows();
      }
    }

    async function reject(id) {
      const note = prompt('Lý do từ chối:', '');
      if (note === null) return;
      try {
        const json = await api(`/api/admin/appointments/${id}/reject`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ note })
        });
        logAction(`Reject appointment #${id}`, json);
        showToast(`Đã từ chối #${id}`, '', true);
        await loadRows();
      } catch (err) {
        console.error(`Reject appointment #${id} failed`, err);
        showToast(`Từ chối #${id} thất bại`, err.message, false);
      }
    }

    document.getElementById('reload').addEventListener('click', loadRows);
    document.getElementById('status').addEventListener('change', loadRows);
    loadRows().catch(err => {
      console.error('Load appointments failed', err);
      showToast('Không tải được danh sách', err.message, false);
    });
  </script>
</body>
</html>
