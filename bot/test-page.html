<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bệnh viện Ung Bướu TP. HCM</title>
  <link rel="icon" href="assets/logo/logo.jpg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('assets/background/background.jpg') center/cover no-repeat;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: min(500px, 100%);
    }

    h1 {
      color: #333;
      font-size: 32px;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 16px;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .hint {
      background: #f0f4ff;
      padding: 15px;
      border-radius: 10px;
      color: #4a5568;
      font-size: 14px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 22px 0 16px;
    }

    .primary-action {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      min-height: 44px;
    }

    .primary-action {
      background: #0b8fdc;
      color: #fff;
      box-shadow: 0 10px 22px rgba(11, 143, 220, 0.24);
    }

    .quick-note {
      display: none;
      margin-top: 10px;
      color: #36506f;
      font-size: 14px;
      line-height: 1.45;
    }

    .quick-note.show {
      display: block;
    }

    @media (max-width: 640px) {
      body {
        align-items: flex-start;
        justify-content: center;
        padding: 18px 14px;
        background-position: center top;
      }

      .card {
        margin-top: 5vh;
        border-radius: 16px;
        padding: 26px 18px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
      }

      h1 {
        font-size: 26px;
        line-height: 1.22;
        margin-bottom: 12px;
      }

      p {
        font-size: 15px;
        margin-bottom: 16px;
      }

      .actions {
        margin: 18px 0 14px;
      }

      .primary-action {
        width: 100%;
        min-height: 48px;
        padding: 13px 16px;
        font-size: 16px;
      }

      .hint,
      .quick-note {
        font-size: 13px;
      }
    }

    @media (max-width: 380px) {
      body {
        padding: 12px;
      }

      .card {
        margin-top: 3vh;
        padding: 22px 14px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🏥 Bệnh viện Ung Bướu TP. Hồ Chí Minh Chat BOT</h1>
    <p>Chào mừng bạn! Khung chat sẽ tự mở để bệnh viện hỗ trợ nhanh hơn.</p>
    <div class="actions">
      <button id="bookAppointment" class="primary-action" type="button">Đặt lịch khám</button>
    </div>
    <div class="hint">
      💡 Thử hỏi: "Giờ mở cửa", "Chi phí khám", "Đặt lịch khám"...
    </div>
    <div id="quickNote" class="quick-note">
      Khung chat đã được mở. Anh/chị vui lòng gửi tin nhắn <strong>đặt lịch khám</strong> để bot bắt đầu hỏi thông tin.
    </div>
  </div>

  <script>
    window.chatwootSettings = {
      showUnreadMessagesDialog: false
    };

    function openChatWidget() {
      if (window.$chatwoot && typeof window.$chatwoot.toggle === 'function') {
        window.$chatwoot.toggle('open');
        return true;
      }
      return false;
    }

    function showAppointmentHint() {
      document.getElementById('quickNote').classList.add('show');
    }

    function openChatWhenReady(retries) {
      if (openChatWidget()) return;
      if (retries <= 0) return;
      window.setTimeout(function () {
        openChatWhenReady(retries - 1);
      }, 500);
    }

    document.getElementById('bookAppointment').addEventListener('click', function () {
      openChatWhenReady(12);
      showAppointmentHint();
    });

    window.addEventListener('chatwoot:ready', function () {
      openChatWhenReady(12);
    });

    (function (d, t) {
      var BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://adminchatbot.dienisme.online';
      var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
      g.src = BASE_URL + "/packs/js/sdk.js";
      g.async = true;
      s.parentNode.insertBefore(g, s);
      g.onload = function () {
        window.chatwootSDK.run({
          websiteToken: 'Nen3HMqqHgVkhCpXRvrijkW3',
          baseUrl: BASE_URL
        });
        openChatWhenReady(12);
      }
    })(document, "script");
  </script>
</body>

</html>
