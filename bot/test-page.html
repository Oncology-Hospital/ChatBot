<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bệnh viện Ung Bướu TP. HCM</title>
  <link rel="icon" href="assets/logo/logo.jpg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('assets/background/background.jpg') center/cover no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 500px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    .hint {
      background: #f0f4ff;
      padding: 15px;
      border-radius: 10px;
      color: #4a5568;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 22px 0 16px;
    }

    .primary-action {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      min-height: 44px;
    }

    .primary-action {
      background: #0b8fdc;
      color: #fff;
      box-shadow: 0 10px 22px rgba(11, 143, 220, 0.24);
    }

    .quick-note {
      display: none;
      margin-top: 10px;
      color: #36506f;
      font-size: 14px;
      line-height: 1.45;
    }

    .quick-note.show {
      display: block;
    }

    .quick-note.error {
      color: #9b1c1c;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🏥 Bệnh viện Ung Bướu TP. Hồ Chí Minh Chat BOT</h1>
    <p>Chào mừng bạn! Khung chat sẽ tự mở để bệnh viện hỗ trợ nhanh hơn.</p>
    <div class="actions">
      <button id="bookAppointment" class="primary-action" type="button">Đặt lịch khám</button>
    </div>
    <div class="hint">
      💡 Thử hỏi: "Giờ mở cửa", "Chi phí khám", "Đặt lịch khám"...
    </div>
    <div id="quickNote" class="quick-note">
      Đang gửi tin nhắn <strong>Đặt lịch khám</strong> vào khung chat...
    </div>
  </div>

  <script>
    function openChatWidget() {
      if (window.$chatwoot && typeof window.$chatwoot.toggle === 'function') {
        window.$chatwoot.toggle('open');
        return true;
      }
      return false;
    }

    function showAppointmentHint() {
      var note = document.getElementById('quickNote');
      note.classList.remove('error');
      note.innerHTML = 'Đang gửi tin nhắn <strong>Đặt lịch khám</strong> vào khung chat...';
      note.classList.add('show');
    }

    function showAppointmentError(message) {
      var note = document.getElementById('quickNote');
      note.classList.add('error');
      note.textContent = message;
      note.classList.add('show');
    }

    function showAppointmentSent() {
      var note = document.getElementById('quickNote');
      note.classList.remove('error');
      note.textContent = 'Đã gửi tin nhắn Đặt lịch khám. Bot sẽ bắt đầu hỏi thông tin trong khung chat.';
      note.classList.add('show');
    }

    function openChatWhenReady(retries) {
      if (openChatWidget()) return;
      if (retries <= 0) return;
      window.setTimeout(function () {
        openChatWhenReady(retries - 1);
      }, 500);
    }

    function readCookie(name) {
      return document.cookie
        .split('; ')
        .map(function (item) { return item.split('='); })
        .find(function (parts) { return parts[0] === name; });
    }

    function getChatwootAuthToken() {
      var cookie = readCookie('cw_conversation');
      return cookie ? decodeURIComponent(cookie.slice(1).join('=')) : '';
    }

    function waitForChatwootAuthToken(retries) {
      return new Promise(function (resolve, reject) {
        var token = getChatwootAuthToken();
        if (token) return resolve(token);
        if (retries <= 0) return reject(new Error('Chưa lấy được phiên Chatwoot. Anh/chị vui lòng thử lại sau vài giây.'));
        window.setTimeout(function () {
          waitForChatwootAuthToken(retries - 1).then(resolve).catch(reject);
        }, 500);
      });
    }

    async function sendAppointmentIntent() {
      var button = document.getElementById('bookAppointment');
      button.disabled = true;
      showAppointmentHint();
      openChatWhenReady(12);

      try {
        var authToken = await waitForChatwootAuthToken(16);
        var response = await fetch('/api/widget/send-appointment-intent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            authToken: authToken,
            content: 'Đặt lịch khám'
          })
        });
        var json = await response.json().catch(function () { return {}; });
        if (!response.ok) throw new Error(json.error || 'Không gửi được tin nhắn đặt lịch.');
        showAppointmentSent();
        openChatWhenReady(4);
      } catch (err) {
        showAppointmentError(err.message || 'Không gửi được tin nhắn đặt lịch. Anh/chị vui lòng gõ Đặt lịch khám trong khung chat.');
      } finally {
        window.setTimeout(function () {
          button.disabled = false;
        }, 1200);
      }
    }

    document.getElementById('bookAppointment').addEventListener('click', function () {
      sendAppointmentIntent();
    });

    (function (d, t) {
      var BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://adminchatbot.dienisme.online';
      var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
      g.src = BASE_URL + "/packs/js/sdk.js";
      g.async = true;
      s.parentNode.insertBefore(g, s);
      g.onload = function () {
        window.chatwootSDK.run({
          websiteToken: 'Nen3HMqqHgVkhCpXRvrijkW3',
          baseUrl: BASE_URL
        });
        openChatWhenReady(12);
      }
    })(document, "script");
  </script>
</body>

</html>
