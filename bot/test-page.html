<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bệnh viện Ung Bướu TP. HCM</title>
  <link rel="icon" href="assets/logo/logo.jpg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('assets/background/background.jpg') center/cover no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 500px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    .hint {
      background: #f0f4ff;
      padding: 15px;
      border-radius: 10px;
      color: #4a5568;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🏥 Bệnh viện Ung Bướu TP. Hồ Chí Minh Chat BOT</h1>
    <p>Chào mừng bạn! Nhấn vào nút chat ở góc phải để được hỗ trợ.</p>
    <div class="hint">
      💡 Thử hỏi: "Giờ mở cửa", "Chi phí khám", "Đặt lịch khám"...
    </div>
  </div>

  <script>
    (function (d, t) {
      var BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000' : 'https://adminchatbot.dienisme.online';
      var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
      g.src = BASE_URL + "/packs/js/sdk.js";
      g.async = true;
      s.parentNode.insertBefore(g, s);
      g.onload = function () {
        window.chatwootSDK.run({
          websiteToken: 'Nen3HMqqHgVkhCpXRvrijkW3',
          baseUrl: BASE_URL
        })
      }
    })(document, "script");
  </script>
</body>

</html>
